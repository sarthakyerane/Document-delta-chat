[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delta-chat"
version = "0.1.0"
description = "Document Delta & Grounded Chat — format-agnostic pipeline for engineering document comparison"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # ── PDF processing ──────────────────────────────────────────────────────────
    "pdfplumber>=0.11.0",         # word-level bbox + table detection (native PDF)
    "PyMuPDF>=1.24.0",            # vector geometry + page rasterization for scans
    # ── DWG / DXF ───────────────────────────────────────────────────────────────
    "ezdxf>=1.3.0",               # pure-Python DXF parser; DWG→DXF via ODA CLI
    # ── OCR fallback ────────────────────────────────────────────────────────────
    "pytesseract>=0.3.10",        # Tesseract OCR (fallback when Gemini Vision unavail)
    "Pillow>=10.0.0",             # image manipulation for rasterized pages
    # ── AI / ML ─────────────────────────────────────────────────────────────────
    "google-generativeai>=0.8.0", # Gemini VLM for OCR+layout, embeddings, fallback LLM
    "groq>=0.11.0",               # Groq SDK — primary LLM (llama-3.3-70b)
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",           # pipeline graph — ingest→delta→retrieve→answer
    # ── Vector store ────────────────────────────────────────────────────────────
    "chromadb>=0.5.0",            # embedded, no extra container
    # ── Alignment helpers ────────────────────────────────────────────────────────
    "rapidfuzz>=3.9.0",           # fuzzy string similarity for element text matching
    "shapely>=2.0.0",             # bbox IoU and centroid distance for geometric alignment
    "numpy>=1.26.0",
    # ── Database ────────────────────────────────────────────────────────────────
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "alembic>=1.13.0",
    # ── Cache ───────────────────────────────────────────────────────────────────
    "redis>=5.0.0",
    # ── API ─────────────────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # ── Observability ────────────────────────────────────────────────────────────
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "structlog>=24.4.0",
    # ── Eval & reporting ─────────────────────────────────────────────────────────
    "tabulate>=0.9.0",
    "rich>=13.7.0",
    "jinja2>=3.1.4",
    # ── Utils ────────────────────────────────────────────────────────────────────
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.7.0",
    "click>=8.1.7",
    "aiofiles>=23.2.1",
    "orjson>=3.10.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "reportlab>=4.2.0",  # synthetic PDF generation for eval dataset
    "faker>=26.0.0",
]

[project.scripts]
delta-chat = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM117"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks tests requiring live API keys",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]
